<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balloon Burst: ร่างกายของฉัน (My Body)</title>
    
    <!-- MediaPipe Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Mali', cursive; /* ฟอนต์น่ารัก อ่านง่าย สำหรับเด็ก */
            background-color: #f0f8ff; /* สีพาสเทลสบายตา */
            user-select: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* กล้องวิดีโอ (ซ่อนไว้เพราะเราจะวาดลง Canvas แทน) */
        video {
            display: none;
        }

        /* Canvas สำหรับวาดเกม */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            object-fit: cover;
        }

        /* UI ซ้อนทับบน Canvas */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        /* แถบโจทย์ด้านบน */
        #task-board {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            border: 4px solid #FFB6C1;
            border-radius: 30px;
            padding: 15px 40px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }

        #task-image {
            font-size: 60px;
        }

        #task-text {
            font-size: 40px;
            color: #333;
            font-weight: 700;
        }

        /* คะแนนมุมซ้ายบน */
        #score-board {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            padding: 10px 20px;
            font-size: 30px;
            font-weight: bold;
            color: #FFA500;
            border: 3px solid #FFFACD;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        /* หน้าจอเริ่มเกม และ จบเกม */
        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(240, 248, 255, 0.95);
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
        }

        h1 {
            font-size: 60px;
            color: #FF69B4;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            text-align: center;
        }

        p.subtitle {
            font-size: 24px;
            color: #555;
            margin-bottom: 40px;
            max-width: 600px;
            text-align: center;
        }

        .btn {
            background: #FF69B4;
            color: white;
            border: none;
            padding: 20px 50px;
            font-size: 32px;
            font-family: 'Mali', cursive;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(255, 105, 180, 0.4);
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        .btn:active {
            transform: scale(0.95);
        }

        #loading {
            font-size: 24px;
            color: #FF69B4;
            margin-top: 20px;
            display: none;
        }

        /* ดาวตอนจบเกม */
        .stars-container {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }
        .star-end {
            font-size: 80px;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
            transform: scale(0);
        }
        .star-end:nth-child(1) { animation-delay: 0.2s; }
        .star-end:nth-child(2) { animation-delay: 0.6s; }
        .star-end:nth-child(3) { animation-delay: 1.0s; }

        @keyframes popIn {
            to { opacity: 1; transform: scale(1); }
        }

        .hidden {
            display: none !important;
        }

    </style>
</head>
<body>

    <div id="game-container">
        <!-- วิดีโอรับภาพจากกล้อง -->
        <video id="webcam" autoplay playsinline></video>
        
        <!-- Canvas สำหรับเรนเดอร์กราฟิกเกม -->
        <canvas id="output_canvas"></canvas>

        <!-- UI เกม -->
        <div id="ui-layer" class="hidden">
            <div id="score-board">⭐ <span id="score">0</span> / 100</div>
            <div id="task-board">
                <span id="task-image">👁️</span>
                <span id="task-text">หา "ตา" ให้หน่อยครับ</span>
            </div>
        </div>

        <!-- หน้าจอเริ่มเกม -->
        <div id="start-screen" class="overlay-screen">
            <h1>🎈 Balloon Burst<br>ร่างกายของฉัน</h1>
            <p class="subtitle">ให้นักเรียนใช้ <strong>"นิ้วชี้"</strong> แตะลูกโป่งที่มีรูปอวัยวะตรงกับเสียงโจทย์ที่ได้ยินนะครับ</p>
            <button class="btn" id="start-btn">เริ่มเล่นเกม</button>
            <div id="loading">กำลังเตรียมกล้องและ AI... กรุณารอสักครู่ ⏳</div>
        </div>

        <!-- หน้าจอจบเกม -->
        <div id="end-screen" class="overlay-screen hidden">
            <h1>เก่งมาก! ยอดเยี่ยมที่สุด!</h1>
            <div class="stars-container">
                <div class="star-end">⭐</div>
                <div class="star-end">⭐</div>
                <div class="star-end">⭐</div>
            </div>
            <button class="btn" onclick="location.reload()">เล่นอีกครั้ง</button>
        </div>
    </div>

    <script>
        // --- ข้อมูลเกม (ฐานข้อมูลคำศัพท์) ---
        const bodyParts = [
            { word: "ตา", emoji: "👁️" }, { word: "หู", emoji: "👂" },
            { word: "จมูก", emoji: "👃" }, { word: "ปาก", emoji: "👄" },
            { word: "มือ", emoji: "🖐️" }, { word: "เท้า", emoji: "🦶" },
            { word: "แขน", emoji: "💪" }, { word: "ขา", emoji: "🦵" },
            { word: "ผม", emoji: "💇" }, { word: "ฟัน", emoji: "🦷" }
        ];

        const distractors = [
            { word: "เสื้อ", emoji: "👕" }, { word: "กางเกง", emoji: "👖" },
            { word: "ดินสอ", emoji: "✏️" }, { word: "แอปเปิล", emoji: "🍎" },
            { word: "รถยนต์", emoji: "🚗" }, { word: "สุนัข", emoji: "🐶" },
            { word: "แมว", emoji: "🐱" }, { word: "ต้นไม้", emoji: "🌳" },
            { word: "ดอกไม้", emoji: "🌻" }, { word: "หมวก", emoji: "🧢" }
        ];

        const pastelColors = ['#FFB3BA', '#FFDFBA', '#FFFFBA', '#BAFFC9', '#BAE1FF', '#E8BAFF'];

        // --- ตั้งค่าตัวแปรเกม ---
        let gameActive = false;
        let score = 0;
        const maxScore = 100; // 10 ข้อ ข้อละ 10 คะแนน
        let currentTarget = null;
        let balloons = [];
        let particles = [];
        
        // --- การตั้งค่า DOM และ Canvas ---
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const scoreEl = document.getElementById('score');
        const taskImageEl = document.getElementById('task-image');
        const taskTextEl = document.getElementById('task-text');
        
        // ปรับขนาด Canvas ให้เต็มจอ
        function resizeCanvas() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // --- ระบบเสียง (Sensory Friendly - Web Audio API & Speech) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        // เสียงตอบถูก: นุ่มนวล คล้ายเสียงกระดิ่งใสๆ
        function playCorrectSound() {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + 0.1);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }

        // เสียงตอบผิด: เสียงกระเด้ง "ดึ๋งๆ" เบาๆ ไม่ตกใจ
        function playBounceSound() {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.05);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        // เสียงพูดโจทย์ (Voice Over)
        function speakTask(word) {
            window.speechSynthesis.cancel();
            const text = `ชี้ไปที่ ${word} ครับ`;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'th-TH';
            utterance.rate = 0.85; // พูดช้าลงเล็กน้อยเพื่อให้เด็กฟังชัด
            utterance.pitch = 1.1; // เสียงสูงขึ้นนิดนึงดูเป็นมิตร
            window.speechSynthesis.speak(utterance);
        }

        // เสียงชมเชย
        const praises = ["เก่งมากครับ!", "เยี่ยมไปเลย!", "ถูกต้องครับ!"];
        function speakPraise() {
            const text = praises[Math.floor(Math.random() * praises.length)];
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'th-TH';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }

        // --- ระบบ Game Logic ---
        
        class Balloon {
            constructor(data, isTarget) {
                this.data = data;
                this.isTarget = isTarget;
                this.radius = Math.random() * 20 + 70; // รัศมี 70-90 ใหญ่ชัดเจน
                this.x = Math.random() * (canvasElement.width - this.radius * 2) + this.radius;
                this.y = canvasElement.height + this.radius + Math.random() * 200;
                this.speedY = -(Math.random() * 1.5 + 1.0); // ลอยช้าๆ สบายตา
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.color = pastelColors[Math.floor(Math.random() * pastelColors.length)];
                this.popped = false;
                this.bouncing = false;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                // กันไม่ให้ลอยออกข้าง
                if (this.x < this.radius || this.x > canvasElement.width - this.radius) {
                    this.speedX *= -1;
                }
            }

            draw(ctx) {
                if (this.popped) return;

                ctx.save();
                ctx.translate(this.x, this.y);

                // เชือก
                ctx.beginPath();
                ctx.moveTo(0, this.radius);
                ctx.quadraticCurveTo(10, this.radius + 20, -5, this.radius + 40);
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#aaa';
                ctx.stroke();

                // ตัวลูกโป่ง
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = 'rgba(255,255,255,0.5)';
                ctx.stroke();

                // ไฮไลต์เงาสะท้อน
                ctx.beginPath();
                ctx.arc(-this.radius * 0.3, -this.radius * 0.3, this.radius * 0.2, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.4)';
                ctx.fill();

                // รูปและข้อความ
                ctx.fillStyle = '#333';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                ctx.font = '50px sans-serif';
                ctx.fillText(this.data.emoji, 0, -10);
                
                ctx.font = 'bold 24px Mali';
                ctx.fillText(this.data.word, 0, 25);

                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.life = 1.0;
                this.decay = Math.random() * 0.02 + 0.02;
                this.size = Math.random() * 10 + 5;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
            }
            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.translate(this.x, this.y);
                
                // วาดดาวกระจาย (Sensory friendly ไม่กระพริบแรง)
                ctx.beginPath();
                for (let i = 0; i < 5; i++) {
                    ctx.lineTo(Math.cos((18 + i * 72) * Math.PI / 180) * this.size, 
                               -Math.sin((18 + i * 72) * Math.PI / 180) * this.size);
                    ctx.lineTo(Math.cos((54 + i * 72) * Math.PI / 180) * (this.size / 2), 
                               -Math.sin((54 + i * 72) * Math.PI / 180) * (this.size / 2));
                }
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }
        }

        function spawnBalloons() {
            if (!gameActive) return;
            
            // รักษาจำนวนลูกโป่งบนจอไม่ให้เยอะเกินไป (ไม่เกิน 4-5 ลูก)
            if (balloons.length < 4) {
                // โอกาส 40% ที่จะเป็นตัวที่ถูกต้อง เพื่อให้เจอคำตอบได้ง่าย
                const isTarget = Math.random() < 0.4; 
                let data;
                
                if (isTarget && currentTarget) {
                    data = currentTarget;
                } else {
                    data = distractors[Math.floor(Math.random() * distractors.length)];
                }
                
                balloons.push(new Balloon(data, isTarget));
            }
            
            setTimeout(spawnBalloons, 1500); // ค่อยๆ ปล่อยทีละลูก
        }

        function nextTask() {
            // สุ่มโจทย์ใหม่
            currentTarget = bodyParts[Math.floor(Math.random() * bodyParts.length)];
            taskImageEl.innerText = currentTarget.emoji;
            taskTextEl.innerText = `หา "${currentTarget.word}"`;
            
            // อ่านโจทย์
            speakTask(currentTarget.word);
            
            // เคลียร์ลูกโป่งเก่าเพื่อให้ไม่สับสน
            balloons = [];
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 20; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function checkCollision(cursorX, cursorY) {
            if (!gameActive) return;

            for (let i = balloons.length - 1; i >= 0; i--) {
                let b = balloons[i];
                if (b.popped) continue;

                // หาระยะห่างระหว่างนิ้ว กับจุดศูนย์กลางลูกโป่ง
                const dx = cursorX - b.x;
                const dy = cursorY - b.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                // **Hitbox กว้างกว่าลูกโป่งจริง 50%** เพื่อให้เด็กจิ้มง่าย (Errorless)
                if (distance < b.radius * 1.5) {
                    if (b.isTarget) {
                        // เจาะถูก (Positive Reinforcement)
                        b.popped = true;
                        createExplosion(b.x, b.y, b.color);
                        playCorrectSound();
                        speakPraise();
                        
                        score += 10;
                        scoreEl.innerText = score;

                        if (score >= maxScore) {
                            endGame();
                        } else {
                            // รอสักพักแล้วเปลี่ยนโจทย์
                            setTimeout(nextTask, 1500);
                        }
                    } else {
                        // เจาะผิด (Errorless Learning - ไม่หักคะแนน แค่เด้งออก)
                        if (!b.bouncing) {
                            b.bouncing = true;
                            b.speedX = (b.x < cursorX ? -5 : 5); // กระเด้งหนีนิ้ว
                            b.speedY = 2; // ร่วงลงนิดหน่อย
                            playBounceSound();
                        }
                    }
                }
            }
        }

        function endGame() {
            gameActive = false;
            document.getElementById('ui-layer').classList.add('hidden');
            document.getElementById('end-screen').classList.remove('hidden');
            
            // เสียงเย้
            let msg = new SpeechSynthesisUtterance("เก่งมากเลยครับ ชนะแล้ว");
            msg.lang = 'th-TH';
            window.speechSynthesis.speak(msg);
        }

        // --- ระบบ MediaPipe Hand Tracking ---
        let fingerX = -100;
        let fingerY = -100;

        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            // 1. วาดวิดีโอแบบ Mirror (กลับซ้ายขวาเพื่อให้เหมือนกระจกเงา เด็กจะไม่งง)
            canvasCtx.translate(canvasElement.width, 0);
            canvasCtx.scale(-1, 1);
            if (results.image) {
                // ปรับขนาดภาพให้เต็ม Canvas
                const imgRatio = results.image.width / results.image.height;
                const canvasRatio = canvasElement.width / canvasElement.height;
                let drawWidth, drawHeight, offsetX = 0, offsetY = 0;

                if (canvasRatio > imgRatio) {
                    drawWidth = canvasElement.width;
                    drawHeight = drawWidth / imgRatio;
                    offsetY = (canvasElement.height - drawHeight) / 2;
                } else {
                    drawHeight = canvasElement.height;
                    drawWidth = drawHeight * imgRatio;
                    offsetX = (canvasElement.width - drawWidth) / 2;
                }
                
                // ทำให้ภาพจางลงเล็กน้อย ไม่รบกวนลูกโป่ง
                canvasCtx.globalAlpha = 0.6;
                canvasCtx.drawImage(results.image, offsetX, offsetY, drawWidth, drawHeight);
                canvasCtx.globalAlpha = 1.0;
            }
            canvasCtx.restore();

            // 2. รับตำแหน่งนิ้ว
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                // ใช้นิ้วชี้ (Landmark 8) ของมือแรกที่ตรวจเจอ
                const indexFinger = results.multiHandLandmarks[0][8];
                
                // แปลงพิกัด (สลับ X เพราะเรา Mirror หน้าจอไว้)
                fingerX = (1 - indexFinger.x) * canvasElement.width;
                fingerY = indexFinger.y * canvasElement.height;

                // ใช้อัลกอริทึมลดการสั่น (Smoothing) ทำให้อย่างง่ายโดยค่อยๆ เลื่อนเคอร์เซอร์
                // (ในโค้ดนี้ใช้ตำแหน่งตรงๆ ก่อนเพื่อให้ Real-time ที่สุด)

                // ตรวจสอบการชน
                checkCollision(fingerX, fingerY);
            } else {
                // เอานิ้วออกนอกจอ
                fingerX = -100;
                fingerY = -100;
            }

            // 3. วาดลูกโป่ง
            for (let i = balloons.length - 1; i >= 0; i--) {
                balloons[i].update();
                balloons[i].draw(canvasCtx);
                // ลบลูกโป่งที่ลอยพ้นขอบบน
                if (balloons[i].y < -100 || balloons[i].x < -100 || balloons[i].x > canvasElement.width + 100) {
                    balloons.splice(i, 1);
                }
            }

            // 4. วาด Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw(canvasCtx);
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                }
            }

            // 5. วาด Cursor มือ/ดาว เรืองแสงที่ปลายนิ้ว
            if (fingerX > 0 && fingerY > 0 && gameActive) {
                canvasCtx.save();
                canvasCtx.translate(fingerX, fingerY);
                
                // เอฟเฟกต์เรืองแสง
                canvasCtx.beginPath();
                canvasCtx.arc(0, 0, 40, 0, Math.PI * 2);
                canvasCtx.fillStyle = 'rgba(255, 215, 0, 0.4)'; // สีเหลืองทอง
                canvasCtx.fill();
                
                // ไอคอนดาว หรือ เป้าหมาย
                canvasCtx.font = '50px sans-serif';
                canvasCtx.textAlign = 'center';
                canvasCtx.textBaseline = 'middle';
                canvasCtx.fillText('⭐', 0, 0);
                
                canvasCtx.restore();
            }
        }

        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});
        
        hands.setOptions({
            maxNumHands: 1, // จับแค่มือเดียวเพื่อลดความสับสน
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7 // ตั้งสูงๆ เพื่อลดการสั่น (Tracking Smoothing)
        });
        
        hands.onResults(onResults);

        // --- เริ่มเกม ---
        document.getElementById('start-btn').addEventListener('click', async () => {
            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('loading').style.display = 'block';

            // เริ่มการทำงานระบบเสียง 
            if(audioCtx.state === 'suspended') audioCtx.resume();
            
            // เปิดกล้องและรัน MediaPipe
            try {
                const camera = new Camera(videoElement, {
                    onFrame: async () => {
                        await hands.send({image: videoElement});
                    },
                    width: 1280,
                    height: 720
                });
                await camera.start();
                
                // เตรียม UI
                document.getElementById('start-screen').classList.add('hidden');
                document.getElementById('ui-layer').classList.remove('hidden');
                
                gameActive = true;
                nextTask();
                spawnBalloons();

            } catch (error) {
                console.error("Camera error:", error);
                alert("ไม่สามารถเข้าถึงกล้องได้ กรุณาตรวจสอบการอนุญาตใช้งานกล้อง (Camera Permission)");
                document.getElementById('start-btn').style.display = 'block';
                document.getElementById('loading').style.display = 'none';
            }
        });

    </script>
</body>
</html>
